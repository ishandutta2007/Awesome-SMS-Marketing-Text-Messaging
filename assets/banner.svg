<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e112a" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="bubbleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="bubbleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.06" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
      .chat-float-1 {
        animation: floatOne 6s ease-in-out infinite alternate;
      }
      .chat-float-2 {
        animation: floatTwo 7s ease-in-out infinite alternate;
      }
      .chat-float-3 {
        animation: floatThree 8s ease-in-out infinite alternate;
      }
      .pulse-circle {
        animation: pulseScale 3s ease-in-out infinite alternate;
      }
      .signal-wave {
        animation: signalSend 4s linear infinite;
      }
      @keyframes floatOne {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-14px) rotate(1.5deg); }
      }
      @keyframes floatTwo {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(12px) rotate(-1.5deg); }
      }
      @keyframes floatThree {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes pulseScale {
        0% { transform: scale(0.96); opacity: 0.4; }
        100% { transform: scale(1.04); opacity: 0.85; }
      }
      @keyframes signalSend {
        0% { stroke-dashoffset: 120; opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
    </style>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Subtle Blueprint Tech Grid -->
  <g class="bg-grid">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="440" y1="0" x2="440" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="680" y1="0" x2="680" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="920" y1="0" x2="920" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Glowing Radial Ambient Orbs in Background -->
  <circle cx="200" cy="120" r="140" fill="#38bdf8" opacity="0.12" filter="url(#shadow)" />
  <circle cx="1020" cy="300" r="160" fill="#ec4899" opacity="0.12" filter="url(#shadow)" />
  <circle cx="600" cy="380" r="110" fill="#6366f1" opacity="0.10" />

  <!-- DYNAMIC ELEMENT 1 (Left Floating Card): Simulated Bulk Campaign Flow -->
  <g class="chat-float-1" transform="translate(60, 65)">
    <rect width="210" height="90" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="28" cy="30" r="12" fill="#10b981" />
    <path d="M24 30 L27 33 L33 26" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Campaign Broadcast</text>
    <text x="48" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">99.4% Delivery • 10DLC Verified</text>
    <rect x="18" y="58" width="174" height="6" rx="3" fill="#0f172a" />
    <rect x="18" y="58" width="145" height="6" rx="3" fill="url(#glowPulse)" />
    <text x="18" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#38bdf8">250,000 / 250,000 sent</text>
  </g>

  <!-- DYNAMIC ELEMENT 2 (Left Lower Pill): OTP & Routing Latency Indicator -->
  <g class="chat-float-2" transform="translate(75, 260)">
    <rect width="195" height="74" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" filter="url(#shadow)"/>
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">⚡ Waterfall Failover</text>
    <text x="20" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Telnyx → Twilio → Plivo</text>
    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#10b981">● Latency: 420ms | OTP Verified</text>
  </g>

  <!-- DYNAMIC ELEMENT 3 (Right Floating Card): 2-Way Conversational Chat Simulation -->
  <g class="chat-float-2" transform="translate(930, 75)">
    <rect width="210" height="110" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Incoming bubble -->
    <rect x="16" y="16" width="130" height="26" rx="8" fill="#334155" />
    <text x="24" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f1f5f9">Exclusive discount code?</text>
    <!-- Outgoing response bubble -->
    <rect x="64" y="48" width="130" height="30" rx="8" fill="#2563eb" />
    <text x="72" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#ffffff" font-weight="600">VIP20 for 20% off!</text>
    <text x="72" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#93c5fd">Delivered • AI Agent 🤖</text>
    <circle cx="186" cy="94" r="4" fill="#10b981" />
    <text x="110" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">Two-way active</text>
  </g>

  <!-- DYNAMIC ELEMENT 4 (Right Lower Pill): Open Source Protocol Specs -->
  <g class="chat-float-1" transform="translate(945, 255)">
    <rect width="195" height="74" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#ec4899" stroke-width="1" stroke-dasharray="3 3" filter="url(#shadow)"/>
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f472b6">📡 Protocols &amp; Standards</text>
    <text x="18" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">SMPP v3.4 • GSM 03.38</text>
    <text x="18" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a7f3d0">RCS Messaging &amp; Webhooks</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed never obscured) -->
  <!-- Top Category Tag Pill -->
  <g transform="translate(460, 48)">
    <rect width="280" height="32" rx="16" fill="#1e293b" stroke="url(#textGrad)" stroke-width="1.2" />
    <circle cx="16" cy="16" r="4" fill="#38bdf8" />
    <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">THE CURATED ECOSYSTEM GUIDE</text>
    <circle cx="264" cy="16" r="4" fill="#ec4899" />
  </g>

  <!-- Main Headline -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.8">
    Awesome SMS Marketing
  </text>
  <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    &amp; Text Messaging
  </text>

  <!-- Decorative Separator Line -->
  <line x1="380" y1="225" x2="820" y2="225" stroke="url(#accentLine)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Subtitle / Value Proposition in Foreground -->
  <text x="600" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1">
    Enterprise Bulk Campaigns • High-Throughput OTP Delivery • Self-Hosted Gateways
  </text>

  <!-- Foreground Feature Badges -->
  <g transform="translate(330, 292)">
    <!-- Badge 1: CPaaS & Gateways -->
    <rect x="0" y="0" width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="82" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">🚀 CPaaS Infrastructure</text>

    <!-- Badge 2: AI Agents & 2-Way -->
    <rect x="185" y="0" width="170" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="270" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c084fc">🤖 AI Agents &amp; Flows</text>

    <!-- Badge 3: 10DLC & Compliance -->
    <rect x="375" y="0" width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="457" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">🛡️ 10DLC Compliance</text>
  </g>

  <!-- Bottom Metric Bar -->
  <text x="600" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
    Curated SaaS Benchmarks • Open-Source GitHub Repositories • Real-World Pricing &amp; Free Tiers
  </text>
</svg>